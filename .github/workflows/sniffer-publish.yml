# Builds the sniffer image (sniffer/Dockerfile's runtime stage) and pushes
# it to ghcr.io/<owner>/mc-sniffer on every merge to main touching the
# sniffer, tagged `main` (what the chart deploys by default) and
# `sha-<commit>`. Lint and tests run on the pull request beforehand
# (sniffer-checks.yml), not here.
#
# To try an unmerged branch in the cluster, push an image from your machine
# instead: `task image:push` in sniffer/, then `task up SNIFFER_TAG=<branch>`.
name: sniffer publish

on:
  push:
    branches: [main]
    paths:
      - "sniffer/**"
      - ".github/workflows/sniffer-publish.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mc-sniffer
          tags: |
            type=raw,value=main
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: sniffer
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max