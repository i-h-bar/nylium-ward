version: '3'

vars:
  RELEASE: minecraft
  CHART: ./chart
  DEPLOY: deploy/minecraft
  POD_SELECTOR: app.kubernetes.io/name=minecraft
  EXPORTS: ./exports
  CILIUM_NAMESPACE: kube-system
  CILIUM_RELEASE: cilium
  CILIUM_VERSION: "1.20.0"
  CILIUM_VALUES: ./cilium/values.yaml

tasks:
  default:
    cmds:
      - task --list-all
    silent: true

  cilium:up:
    desc: Install or upgrade Cilium (CNI + Hubble) into kube-system
    cmds:
      - helm repo add cilium https://helm.cilium.io/ --force-update
      - helm repo update cilium
      - helm upgrade --install {{.CILIUM_RELEASE}} cilium/cilium
          --namespace {{.CILIUM_NAMESPACE}}
          --version {{.CILIUM_VERSION}}
          -f {{.CILIUM_VALUES}}
          --wait --timeout 10m
      - task: cilium:status

  cilium:status:
    desc: Show Cilium's DaemonSet/operator rollout status
    cmds:
      - kubectl -n {{.CILIUM_NAMESPACE}} rollout status daemonset/cilium --timeout=5m
      - kubectl -n {{.CILIUM_NAMESPACE}} rollout status deployment/cilium-operator --timeout=5m
      - kubectl -n {{.CILIUM_NAMESPACE}} get pods -l k8s-app=cilium

  cilium:audit-on:
    desc: Enable Cilium policy audit mode cluster-wide (logs drops via Hubble, enforces nothing)
    cmds:
      - helm upgrade {{.CILIUM_RELEASE}} cilium/cilium
          --namespace {{.CILIUM_NAMESPACE}}
          --version {{.CILIUM_VERSION}}
          -f {{.CILIUM_VALUES}}
          --set policyAuditMode=true
          --wait --timeout 10m
      - task: cilium:status

  cilium:audit-off:
    desc: Disable Cilium policy audit mode cluster-wide (return to full enforcement)
    cmds:
      - helm upgrade {{.CILIUM_RELEASE}} cilium/cilium
          --namespace {{.CILIUM_NAMESPACE}}
          --version {{.CILIUM_VERSION}}
          -f {{.CILIUM_VALUES}}
          --set policyAuditMode=false
          --wait --timeout 10m
      - task: cilium:status

  hubble:
    desc: Stream live network flows from the local Cilium agent (Ctrl-C to stop)
    interactive: true
    cmds:
      - |
        set -euo pipefail
        POD=$(kubectl -n {{.CILIUM_NAMESPACE}} get pod -l k8s-app=cilium \
          -o jsonpath='{.items[0].metadata.name}')
        kubectl -n {{.CILIUM_NAMESPACE}} exec -it "$POD" -- hubble observe --follow

  playit:sync-ips:
    desc: 'Fetch playit.gg''s published IP ranges into chart/files/playit-allowed-cidrs.txt (review the git diff and commit by hand)'
    cmds:
      - ./scripts/sync-playit-ips.sh

  secrets:
    desc: Create or update the Kubernetes secret from .env
    preconditions:
      - sh: test -f .env
        msg: ".env not found — copy .env.example to .env and fill in PLAYIT_SECRET_KEY"
      - sh: grep -q '^PLAYIT_SECRET_KEY=.\+' .env
        msg: "PLAYIT_SECRET_KEY is empty in .env — the tunnel cannot start without it"
    cmds:
      - kubectl create secret generic minecraft-secrets
          --from-env-file=.env --dry-run=client -o yaml | kubectl apply -f -

  secrets:encrypt-rotate:
    desc: 'One-time: migrate existing secrets after scripts/setup.sh enables k3s secrets-encryption on an already-running cluster (needs sudo; not needed on a fresh install)'
    cmds:
      - sudo k3s secrets-encrypt rotate-keys
      - |
        set -euo pipefail
        echo "Waiting for re-encryption to finish..."
        until sudo k3s secrets-encrypt status | grep -q "Current Rotation Stage: reencrypt_finished"; do
          sleep 5
        done
        sudo k3s secrets-encrypt status
      - echo "Secrets re-encryption complete."

  up:
    desc: Install or upgrade the release (waits for the server to be ready, then narrows network policy)
    deps: [secrets]
    vars:
      JAVA_TAG:
        sh: RELEASE={{.RELEASE}} CHART={{.CHART}} DEPLOY={{.DEPLOY}} ./scripts/resolve-java-tag.sh
      JAVA_DIGEST:
        sh: ./scripts/resolve-image-digest.sh registry-1.docker.io itzg/minecraft-server {{.JAVA_TAG}}
    cmds:
      # Best-effort refresh so a stale checkout doesn't ship an outdated
      # allowlist. Failure isn't fatal — falls back to what's committed.
      - cmd: ./scripts/sync-playit-ips.sh
        ignore_error: true
      - echo "Deploying — this can take 10+ minutes on first boot while the modpack downloads. Check progress with 'task logs' in another terminal."
      - helm upgrade --install {{.RELEASE}} {{.CHART}} --set image.tag={{.JAVA_TAG}} --set image.digest={{.JAVA_DIGEST}}
          --set networkPolicy.phase=install --wait --timeout 20m
      - helm upgrade --install {{.RELEASE}} {{.CHART}} --set image.tag={{.JAVA_TAG}} --set image.digest={{.JAVA_DIGEST}}
          --set networkPolicy.phase=steady

  netpol:install:
    desc: 'Manual escape hatch: widen the CiliumNetworkPolicy to the install-phase FQDN allowlist (remember to run netpol:steady once the pod is healthy)'
    cmds:
      - helm upgrade --install {{.RELEASE}} {{.CHART}} --set networkPolicy.phase=install

  netpol:steady:
    desc: 'Manual escape hatch: narrow the CiliumNetworkPolicy back to the steady-phase FQDN allowlist'
    cmds:
      - helm upgrade --install {{.RELEASE}} {{.CHART}} --set networkPolicy.phase=steady

  down:
    desc: Uninstall the release (the world PVC is retained)
    cmds:
      - helm uninstall {{.RELEASE}}
      - 'echo "PVC minecraft-data retained. Delete deliberately: kubectl delete pvc minecraft-data"'

  status:
    desc: Show pods, PVC, and service state
    cmds:
      - kubectl get pods,pvc,svc -l app.kubernetes.io/instance={{.RELEASE}}
      - kubectl get pods -l {{.POD_SELECTOR}}

  logs:
    desc: Stream server logs
    cmds:
      - kubectl logs -f {{.DEPLOY}}

  console:
    desc: Open an RCON console on the server
    interactive: true
    cmds:
      - kubectl exec -it {{.DEPLOY}} -- rcon-cli

  restart:
    desc: Restart the server pod (broad network policy while it comes back, narrowed once Ready)
    vars:
      JAVA_TAG:
        sh: RELEASE={{.RELEASE}} CHART={{.CHART}} DEPLOY={{.DEPLOY}} ./scripts/resolve-java-tag.sh
      JAVA_DIGEST:
        sh: ./scripts/resolve-image-digest.sh registry-1.docker.io itzg/minecraft-server {{.JAVA_TAG}}
    cmds:
      - helm upgrade --install {{.RELEASE}} {{.CHART}} --set image.tag={{.JAVA_TAG}} --set image.digest={{.JAVA_DIGEST}}
          --set networkPolicy.phase=install
      - kubectl rollout restart {{.DEPLOY}}
      - kubectl rollout status {{.DEPLOY}} --timeout=20m
      - helm upgrade --install {{.RELEASE}} {{.CHART}} --set image.tag={{.JAVA_TAG}} --set image.digest={{.JAVA_DIGEST}}
          --set networkPolicy.phase=steady

  export:
    desc: Consistent world snapshot to ./exports (safe on a running server)
    cmds:
      - mkdir -p {{.EXPORTS}}
      - |
        set -euo pipefail
        POD=$(kubectl get pod -l {{.POD_SELECTOR}} \
          -o jsonpath='{.items[0].metadata.name}')
        OUT="{{.EXPORTS}}/world-$(date +%Y%m%d-%H%M%S).tar.gz"

        # Re-enable saving no matter how we leave this block. If this is
        # skipped, the server runs with saving off and loses everything.
        restore_saving() {
          kubectl exec "$POD" -- rcon-cli save-on \
            || echo "WARNING: could not re-enable saving. Run 'task console' and issue 'save-on' NOW." >&2
        }
        trap restore_saving EXIT

        kubectl exec "$POD" -- rcon-cli save-off
        kubectl exec "$POD" -- rcon-cli save-all flush
        sleep 5

        # Record which modpack build this world belongs to; a modded world is
        # unusable without the identical pack.
        kubectl exec "$POD" -- sh -c \
          'mkdir -p /tmp/exportmeta && printf "CF_SLUG=%s\nCF_FILE_ID=%s\nEXPORTED=%s\n" \
            "$CF_SLUG" "$CF_FILE_ID" "$(date -u +%FT%TZ)" > /tmp/exportmeta/PACK.txt'

        kubectl exec "$POD" -- tar czf - -C /data world -C /tmp/exportmeta PACK.txt > "$OUT"

        echo "Exported $OUT ($(du -h "$OUT" | cut -f1))"

  restore:
    desc: 'Replace the world from a snapshot. Usage: task restore FILE=exports/world-....tar.gz'
    requires:
      vars: [FILE]
    cmds:
      - |
        set -euo pipefail
        test -f "{{.FILE}}" || { echo "No such file: {{.FILE}}" >&2; exit 1; }

        echo "Stopping the server (restore cannot run against a live world)..."
        kubectl scale {{.DEPLOY}} --replicas=0
        kubectl wait --for=delete pod -l {{.POD_SELECTOR}} --timeout=300s

        kubectl delete pod mc-restore --ignore-not-found
        kubectl run mc-restore --restart=Never --image=busybox:1.36 \
          --overrides='{
            "spec": {
              "securityContext": {"fsGroup": 1000},
              "containers": [{
                "name": "mc-restore",
                "image": "busybox:1.36",
                "command": ["sleep", "600"],
                "volumeMounts": [{"name": "data", "mountPath": "/data"}]
              }],
              "volumes": [{
                "name": "data",
                "persistentVolumeClaim": {"claimName": "minecraft-data"}
              }]
            }
          }'
        kubectl wait --for=condition=Ready pod/mc-restore --timeout=120s

        kubectl exec mc-restore -- rm -rf /data/world
        # Extract only the world member; PACK.txt stays out of /data.
        kubectl exec -i mc-restore -- tar xzf - -C /data world < "{{.FILE}}"

        kubectl delete pod mc-restore --wait=true
        helm upgrade --install {{.RELEASE}} {{.CHART}} --set networkPolicy.phase=install
        kubectl scale {{.DEPLOY}} --replicas=1
        kubectl rollout status {{.DEPLOY}} --timeout=20m
        helm upgrade --install {{.RELEASE}} {{.CHART}} --set networkPolicy.phase=steady
        echo "Restored from {{.FILE}}"

  upgrade:
    desc: 'Apply a modpack.yaml change (fileId and/or excludeMods). Edit chart/values.yaml first, then run this.'
    vars:
      JAVA_TAG:
        sh: RELEASE={{.RELEASE}} CHART={{.CHART}} DEPLOY={{.DEPLOY}} ./scripts/resolve-java-tag.sh
      JAVA_DIGEST:
        sh: ./scripts/resolve-image-digest.sh registry-1.docker.io itzg/minecraft-server {{.JAVA_TAG}}
    cmds:
      - task: export
      - helm upgrade --install {{.RELEASE}} {{.CHART}} --set image.tag={{.JAVA_TAG}} --set image.digest={{.JAVA_DIGEST}}
          --set networkPolicy.phase=install --set modpack.forceSynchronize=true --wait --timeout 30m
      - kubectl rollout status {{.DEPLOY}} --timeout=30m
      - helm upgrade --install {{.RELEASE}} {{.CHART}} --set image.tag={{.JAVA_TAG}} --set image.digest={{.JAVA_DIGEST}}
          --set networkPolicy.phase=steady --set modpack.forceSynchronize=false
      - |
        echo "Upgrade complete. If the world is broken, roll back with:"
        echo "  task restore FILE=$(ls -t {{.EXPORTS}}/world-*.tar.gz | head -1)"
        echo "NOTE: 'helm rollback' reverts manifests only — it does NOT revert the world or installed mods."