apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-config
  labels:
    {{- include "mc.labels" . | nindent 4 }}
data:
  EULA: "TRUE"
  TYPE: "AUTO_CURSEFORGE"
  CF_SLUG: {{ required "modpack.slug is required — set it in chart/values.yaml (from the CurseForge modpack URL)" .Values.modpack.slug | quote }}
  CF_FILE_ID: {{ required "modpack.fileId is required — pin a CurseForge file id in chart/values.yaml so restarts cannot upgrade the pack" .Values.modpack.fileId | quote }}
  MEMORY: {{ .Values.server.memory | quote }}
  USE_AIKAR_FLAGS: {{ .Values.server.aikarFlags | quote }}
  MOTD: {{ .Values.server.motd | quote }}
  DIFFICULTY: {{ .Values.server.difficulty | quote }}
  MAX_PLAYERS: {{ .Values.server.maxPlayers | quote }}
  VIEW_DISTANCE: {{ .Values.server.viewDistance | quote }}
  TZ: {{ .Values.server.tz | quote }}
  OPS: {{ join "," .Values.server.ops | quote }}
  ENABLE_RCON: "true"
  STOP_DURATION: "60"
  {{- range $key, $value := .Values.server.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}