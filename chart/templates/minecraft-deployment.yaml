apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  labels:
    {{- include "mc.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mc.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/connectivity-config: {{ include (print $.Template.BasePath "/connectivity-configmap.yaml") . | sha256sum }}
        checksum/fml-config: {{ include (print $.Template.BasePath "/fml-configmap.yaml") . | sha256sum }}
    spec:
      # The image traps SIGTERM and sends `stop` via RCON, waiting up to
      # STOP_DURATION (60s). The 30s default would SIGKILL mid-save.
      terminationGracePeriodSeconds: 120
      # Same fix as playit-deployment.yaml. Not confirmed broken here, but
      # relying on glibc's ndots fallback timing isn't worth depending on.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minecraft
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETUID
                - SETGID
                - FOWNER
                - DAC_OVERRIDE
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
          envFrom:
            - configMapRef:
                name: minecraft-config
          env:
            - name: CF_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: CF_API_KEY
                  optional: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            exec:
              command: ["mc-health"]
            periodSeconds: 15
            failureThreshold: {{ mul .Values.probes.startupMinutes 4 }}
          livenessProbe:
            exec:
              command: ["mc-health"]
            periodSeconds: 30
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["mc-health"]
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: connectivity-config
              mountPath: /config/connectivity.json
              subPath: connectivity.json
            - name: fml-config
              mountPath: /config/fml.toml
              subPath: fml.toml
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
        - name: connectivity-config
          configMap:
            name: minecraft-connectivity-config
        - name: fml-config
          configMap:
            name: minecraft-fml-config