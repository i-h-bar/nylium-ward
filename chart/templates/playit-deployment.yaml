apiVersion: apps/v1
kind: Deployment
metadata:
  name: playit
  labels:
    {{- include "playit.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "playit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "playit.selectorLabels" . | nindent 8 }}
    spec:
      # ndots:5's default search-domain expansion breaks playit's resolver —
      # it doesn't fall through to the bare name after the cluster-local
      # suffixes fail (confirmed live: infinite retry, tunnel never connects).
      # ndots:1 skips straight to the real query.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: playit
          {{- if not .Values.playit.image.digest }}
          {{- fail "playit.image.digest is required — see the comment above it in values.yaml" }}
          {{- end }}
          image: "{{ .Values.playit.image.repository }}:{{ .Values.playit.image.tag }}@{{ .Values.playit.image.digest }}"
          imagePullPolicy: {{ .Values.playit.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - --socket-path=/tmp/playitd.sock
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: PLAYIT_SECRET_KEY
          resources:
            {{- toYaml .Values.playit.resources | nindent 12 }}