apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: playit
  labels:
    {{- include "playit.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "playit.selectorLabels" . | nindent 6 }}
  # Empty ingress list = default-deny ingress, no exceptions. Nothing calls
  # into this pod — it dials out to playit.gg and forwards to the minecraft
  # Service; the minecraft pod's own ingress rule is what actually admits
  # players (via CiliumNetworkPolicy/minecraft).
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: "playit.gg"
              - matchPattern: "*.playit.gg"
              - matchName: "ply.gg"
              - matchPattern: "*.ply.gg"
              - matchName: "playit.cloud"
              - matchPattern: "*.playit.cloud"
    # Relay path: playit forwards accepted connections to the minecraft
    # Service on 25565. Without this, the toCIDRSet rule below wouldn't cover
    # it — that rule is scoped to playit.gg's public ranges, not the cluster.
    - toEndpoints:
        - matchLabels:
            {{- include "mc.selectorLabels" . | nindent 12 }}
      toPorts:
        - ports:
            - port: "25565"
              protocol: TCP
    # Control/API traffic. api.playit.gg is Cloudflare-fronted — it resolves
    # to Cloudflare edge IPs, not any of playit's own published ranges below
    # — confirmed live: the pod couldn't reach it at all under a CIDR-only
    # rule. This has to be toFQDNs (follows whatever IP DNS actually
    # returns), the same mechanism minecraft's allowlist uses, not a static
    # CIDR set.
    - toFQDNs:
        - matchName: "playit.gg"
        - matchPattern: "*.playit.gg"
        - matchName: "ply.gg"
        - matchPattern: "*.ply.gg"
        - matchName: "playit.cloud"
        - matchPattern: "*.playit.cloud"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # playit.gg's published relay/edge IP ranges (ips.txt, the full union of
    # free+premium), synced from https://github.com/playit-cloud/network via
    # `task playit:sync-ips` into chart/files/playit-allowed-cidrs.txt — for
    # playit's own relay/data-plane infrastructure, which isn't Cloudflare-
    # fronted the way the control API above is. "world" is gone entirely —
    # it isn't scoped to the public internet and previously let this pod
    # reach the local network, not just playit.gg. Comment lines and blanks
    # in the source file are skipped below.
    - toCIDRSet:
        {{- range .Files.Lines "files/playit-allowed-cidrs.txt" }}
        {{- if and . (not (hasPrefix "#" .)) }}
        - cidr: {{ . | quote }}
        {{- end }}
        {{- end }}