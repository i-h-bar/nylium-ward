apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-data
  labels:
    {{- include "mc.labels" . | nindent 4 }}
  annotations:
    # Keeps the world when the release is uninstalled. Delete deliberately:
    #   kubectl delete pvc minecraft-data
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}