# Minecraft server image. Pinned — never use `latest`.
# tag is normally overridden by `task up`/`upgrade`/`restart`, which run
# scripts/resolve-java-tag.sh to pick the itzg Java-version tag (javaNN)
# matching the pinned modpack's Minecraft version — Forge/NeoForge/Fabric's
# bundled Mixin can't even read JDK classes from a too-new JVM, so this has
# to match. This value is only what's used for a raw `helm upgrade`/`template`
# run that bypasses those tasks.
#
# digest is resolved and set the same way (scripts/resolve-image-digest.sh,
# via the same tasks) so the deployed image is pinned by content, not just a
# mutable tag — empty here since it depends on whatever tag gets resolved.
# Left empty, the image renders as repository:tag only (the raw-bypass case
# above isn't digest-pinned either).
image:
  repository: itzg/minecraft-server
  tag: "2026.8.0"
  digest: ""
  pullPolicy: IfNotPresent

# CurseForge modpack. Both values are REQUIRED; there are no defaults.
# Find the slug in the modpack URL: curseforge.com/minecraft/modpacks/<slug>
# Pin fileId so a pod restart can never silently upgrade the pack.
modpack:
  slug: "dawn-craft"
  fileId: "7243862"
  # CurseForge project slugs or numeric IDs to skip during mod install — for a
  # mod whose file is hosted off CurseForge and that host has since gone
  # defunct, this is the only way to unblock install without forking the pack.
  # Skipping a mod the server actually needs will break it; that's a call only
  # you can make per mod. Comma/space-delimited under the hood, so a plain
  # YAML list works.
  excludeMods:
    # Mixins server.properties on every boot to apply pack-default values —
    # meant to run once (guarded by a marker file it never actually writes
    # here), so it silently reverts RCON/MOTD/max-players/view-distance/
    # command-block back to its own defaults ~30s after mc-image-helper
    # writes ours from this chart, every single restart. Its own defaults
    # (allow-nether=false, generate-structures=false, etc.) are already
    # persisted in server.properties, so excluding it doesn't change them —
    # it just stops it from re-clobbering everything else afterward.
    - "default-server-properties"
  # Last-applied state for the installer's exclude/include re-evaluation —
  # toggled automatically by `task upgrade` (true during the deploy, false
  # once applied). Not something to hand-edit in normal use.
  forceSynchronize: false

server:
  memory: 6G            # JVM heap. Keep resources.limits.memory ~2Gi above this.
  aikarFlags: true
  motd: "Modded Minecraft"
  difficulty: normal
  maxPlayers: 10
  viewDistance: 10
  ops: []               # Minecraft usernames, e.g. [Notch, jeb_]
  tz: UTC
  enableCommandBlock: false   # itzg/vanilla default; some packs require true (check the pack's server README)
  extraEnv:             # Any additional itzg env var, e.g. {SPAWN_PROTECTION: "0"}
    # mc-image-helper's bundled cf-exclude-include.json globally excludes
    # particular-reforged as client-only, but for this pack it registers a
    # Forge network channel without a server-absent allowance — so clients
    # get "mismatched mod channel list" on connect unless the server also
    # installs it. Other packs (beyond-depth, ftb-stoneblock-4, mc-eternal-2)
    # have the same override upstream; deceasedcraft doesn't yet. Value is a
    # comma/space-delimited list of project slugs or IDs, same as excludeMods.
    CF_FORCE_INCLUDE_MODS: "particular-reforged,nether-skeletons"
    # Default connect/read timeout for Java's legacy URLConnection API, which
    # most mods' bespoke "phone home" update/contributor checkers use without
    # setting their own timeout — otherwise they inherit the JVM/OS default,
    # which can be a minute or more per check. This only fills in a default;
    # mods that already set their own timeout are unaffected. Doesn't touch
    # the network policy or checkers built on the newer java.net.http.HttpClient.
    JVM_DD_OPTS: "sun.net.client.defaultConnectTimeout=5000,sun.net.client.defaultReadTimeout=5000"

# Optional server resource pack, pushed to every client on join.
resourcePack:
  url: ""          # direct .zip URL; leave empty to disable
  sha1: ""         # optional checksum, recommended if url is set
  enforce: false   # kick clients who decline the pack

# No CPU limit on purpose: CFS throttling on a JVM causes GC pauses players feel.
resources:
  requests:
    cpu: "2"
    memory: 8Gi
  limits:
    memory: 8Gi

persistence:
  size: 20Gi
  storageClass: local-path

# clusterIP is pinned so the playit.gg dashboard destination never changes.
# Must fall inside the cluster's service CIDR (k3s default: 10.43.0.0/16).
service:
  clusterIP: 10.43.255.65
  port: 25565

# First boot downloads the modpack and generates a world. Raise if that times out.
probes:
  startupMinutes: 15

playit:
  image:
    repository: ghcr.io/playit-cloud/playit-agent
    tag: "1.0.10"
    # Pinned by content, not just tag — a compromised or mutated tag can't
    # silently change what gets deployed. Required (the chart fails to render
    # without it), since unlike minecraft's tag this one is static, not
    # resolved per-deploy — there's no legitimate reason for it to be empty.
    # Re-resolve when bumping tag:
    #   ./scripts/resolve-image-digest.sh ghcr.io playit-cloud/playit-agent <tag>
    digest: "sha256:ca4766ced6e5bcee19137337808ec8fee5867c0910ac737efbb0bb452c378521"
    pullPolicy: IfNotPresent
  # Observed idle/active usage is ~1m CPU / 5Mi memory (kubectl top); these
  # give ~10-25x headroom rather than leaving the agent unbounded.
  resources:
    requests:
      cpu: "10m"
      memory: 32Mi
    limits:
      cpu: "200m"
      memory: 128Mi

# Cilium network policy. The chart is installed against a cluster that already
# has Cilium as its CNI (see scripts/setup.sh / cilium/values.yaml) — these
# values only control what CiliumNetworkPolicy allows, not whether Cilium runs.
networkPolicy:
  # Modpack-specific egress additions (mods that phone home to their own
  # servers). e.g. ["updates.somemod.dev"]
  extraAllowedFQDNs: []

# Created by `task secrets` from .env — NOT managed by this chart.
secretName: minecraft-secrets