version: '3'

# Scoped to this directory on purpose — sniffer development/run commands stay
# separate from the parent repo's Taskfile.yaml (server lifecycle, Cilium,
# playit). Run these from sniffer/, not the repo root.

vars:
  IFACE: '{{.IFACE | default "eth0"}}'
  IMAGE: ghcr.io/i-h-bar/mc-sniffer
  # The current branch name (`/` -> `-`), for trying an unmerged branch in
  # the cluster: `task image:push` here, then `task up SNIFFER_TAG=<branch>`
  # from the repo root. CI only ever publishes `main` (on merge).
  TAG:
    sh: git rev-parse --abbrev-ref HEAD | tr '/' '-'

tasks:
  default:
    cmds:
      - task --list-all
    silent: true

  run:
    desc: 'Build and attach the real XDP program (needs root — see .cargo/config.toml). Usage: task run [IFACE=eth0]'
    interactive: true
    cmds:
      - sudo -E cargo run --release -- --iface {{.IFACE}}

  test:docker:
    desc: 'Integration tests: build + run the Docker test harness, probe it, tear down (needs Docker; no sudo, no host networking touched)'
    dir: tests
    cmds:
      - uv run pytest

  image:build:
    desc: 'Build the deployable image (Dockerfile''s runtime stage). Usage: task image:build [TAG=<current branch>]'
    cmds:
      - docker build --target runtime --platform linux/amd64 -t {{.IMAGE}}:{{.TAG}} .

  image:push:
    desc: 'Build and push the deployable image to GHCR. Needs `docker login ghcr.io` with a token that has write:packages. Usage: task image:push [TAG=<current branch>]'
    deps: [image:build]
    cmds:
      - docker push {{.IMAGE}}:{{.TAG}}
      - 'echo "Pushed {{.IMAGE}}:{{.TAG}} -- deploy from the repo root with: task up SNIFFER_TAG={{.TAG}}"'